version: "3.9"

services:
  frontend:
    build: ./blood-analyzer
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=befit
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: befit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/query.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:

# When building images/starting containers for first time, run: "docker-compose up --build", make sure docker desktop is open

# run: "docker-compose up" to build the images and start the containers locally on your machine
# run: "docker-compose -f Docker-compose.yaml -f Docker.compose.prod.yaml up" to pull the containers from my repo and run it.